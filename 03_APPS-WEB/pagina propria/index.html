    <!-- Open Graph (WhatsApp / Facebook / Instagram / Telegram) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://latheessence.com/" />
    <meta property="og:title" content="LATHE ESSENCE — Alta Perfumería & Venta Mayorista" />

    <meta property="og:image:type" content="image/jpeg" />

    <meta property="og:site_name" content="LATHE ESSENCE" />
    <meta property="og:locale" content="es_AR" />

    <!-- Twitter Cards (X) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://latheessence.com/" />
    <meta name="twitter:title" content="LATHE ESSENCE — Alta Perfumería & Venta Mayorista" />
    <meta name="twitter:description" content="Importaciones directas en micro-lotes. Catálogo exclusivo con precios minoristas y mayoristas con hasta 55% de margen." />
    <meta name="twitter:image" content="https://latheessence.com/og-lathe-essence.jpg" />

    <!-- PWA & Mobile Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B0C10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LATHE ESSENCE" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- Datos Estructurados JSON-LD (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "LATHE ESSENCE",
      "alternateName": "LATHE ESSENCE Alta Perfumería",
      "url": "https://latheessence.com",
      "logo": "https://latheessence.com/icons/icon-512.png",
      "image": "https://latheessence.com/og-lathe-essence.jpg",
      "description": "Venta minorista y mayorista de alta perfumería importada en micro-lotes.",
      "priceRange": "$$",
      "currenciesAccepted": "ARS, USD",
      "paymentAccepted": "Transferencia, Mercado Pago, Cripto",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "AR"
      }
    }
    </script>
    
    <!-- Hardened Security Meta Tags: CSP, Anti-Clickjacking & MIME Protection -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com https://lh3.googleusercontent.com; connect-src 'self' ws: wss: https:;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />

    <!-- Anti-Clickjacking Framebusting Client Protection -->
    <script>
      if (window.top !== window.self) {
        window.top.location = window.self.location;
      }
    </script>

    <!-- Instant preload of critical video frame 0 for 0ms First Meaningful Paint -->
    <link rel="preload" as="image" href="/assets/frames_webp/f_000.webp" type="image/webp" fetchpriority="high" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('lathe_theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..800&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Geist+Mono:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="font-['Plus_Jakarta_Sans',sans-serif] antialiased overflow-x-hidden transition-colors duration-200 bg-white dark:bg-[#000000] text-neutral-900 dark:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
