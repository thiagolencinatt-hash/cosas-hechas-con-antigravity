<!doctype html>
<html lang="es-AR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo/lathe-logo-white.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LATHE ESSENCE — Alta Perfumería por Mayor • Importaciones Directas</title>
    <meta name="description" content="LATHE ESSENCE: Venta por mayor de fragancias importadas de alta gama. Mínimo 5 unidades combinando marcas y modelos. Envíos asegurados a todo el país." />
    
    <!-- Instant preload of critical video frame 0 for 0ms First Meaningful Paint -->
    <link rel="preload" as="image" href="/assets/frames_webp/f_000.webp" type="image/webp" fetchpriority="high" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('lathe_theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..800&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Geist+Mono:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="font-['Plus_Jakarta_Sans',sans-serif] antialiased overflow-x-hidden transition-colors duration-200 bg-white dark:bg-[#000000] text-neutral-900 dark:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
